version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: hirepilot-postgres
    environment:
      POSTGRES_DB: hirepilot
      POSTGRES_USER: hirepilot
      POSTGRES_PASSWORD: hirepilot_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirepilot -d hirepilot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hirepilot-network

  # ─────────────────────────────────────────────
  # Apache Kafka (KRaft mode — no Zookeeper)
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: hirepilot-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - hirepilot-network

  # ─────────────────────────────────────────────
  # Kafka UI (Kafdrop) — Debug & monitor topics
  # ─────────────────────────────────────────────
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.2
    container_name: hirepilot-kafdrop
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      JVM_OPTS: "-Xms32M -Xmx64M"
    ports:
      - "9000:9000"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - hirepilot-network

  # ─────────────────────────────────────────────
  # Qdrant — Vector Database for semantic matching
  # ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: hirepilot-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hirepilot-network

  # ─────────────────────────────────────────────
  # Jaeger — Distributed tracing UI (OpenTelemetry)
  # ─────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: hirepilot-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    networks:
      - hirepilot-network

  # ─────────────────────────────────────────────
  # Redis — Lightweight caching + session store
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: hirepilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - hirepilot-network

volumes:
  postgres_data:
  kafka_data:
  qdrant_data:
  redis_data:

networks:
  hirepilot-network:
    driver: bridge
