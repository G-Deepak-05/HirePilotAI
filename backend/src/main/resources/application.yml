spring:
  application:
    name: hirepilot-backend

  # ─── PostgreSQL ───────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/hirepilot
    username: hirepilot
    password: hirepilot_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ─── Liquibase ────────────────────────────────────────────────
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # ─── Kafka ───────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: hirepilot-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hirepilot.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ─── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379

  # ─── File Upload ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── WebFlux / WebClient ─────────────────────────────────────
  webflux:
    base-path: /

# ─── Server ──────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ─── Actuator ────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# ─── Ollama Configuration ────────────────────────────────────────
ollama:
  base-url: http://localhost:11434
  models:
    jd-analyzer: qwen3:8b      # Resume parsing + JD analysis
    resume-writer: qwen3:8b    # Resume optimization + cover letter writing
    reasoning: deepseek-r1:8b  # Interview prep + screening answers (chain-of-thought)
  timeout-seconds: 300

# ─── Qdrant Configuration ────────────────────────────────────────
qdrant:
  host: localhost
  port: 6333
  collections:
    resumes: resume-vectors
    jobs: job-vectors

# ─── HirePilot Business Config ───────────────────────────────────
hirepilot:
  matching:
    auto-apply-threshold: 70
    manual-review-threshold: 50
    weights:
      skills: 0.4
      experience: 0.3
      keywords: 0.2
      location: 0.1
  storage:
    resumes-dir: ${user.home}/.hirepilot/resumes
  auto-apply:
    human-confirmation-required: true

# ─── Logging ─────────────────────────────────────────────────────
logging:
  level:
    com.hirepilot: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
